<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="pillGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="pillGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Filters for Glow and Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.4" />
      <circle cx="40" cy="40" r="1.5" fill="#475569" fill-opacity="0.5" />
    </pattern>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 52px;
        fill: #ffffff;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 20px;
        fill: #94a3b8;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #f8fafc;
      }
      .card-header {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 700;
        font-size: 13px;
        fill: #cbd5e1;
      }
      .card-sub {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 11px;
        fill: #64748b;
      }

      /* Dynamic Animations (ambient & subtle in background) */
      @keyframes floatOrb1 {
        0%, 100% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(40px, -30px) scale(1.15); }
      }
      @keyframes floatOrb2 {
        0%, 100% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(-35px, 25px) scale(1.1); }
      }
      @keyframes pulseGantt {
        0%, 100% { opacity: 0.85; stroke-dashoffset: 0; }
        50% { opacity: 1; stroke-dashoffset: -20; }
      }
      @keyframes progressFlow {
        0% { stroke-dashoffset: 120; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes boardBob {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }

      .orb-1 { animation: floatOrb1 10s ease-in-out infinite; }
      .orb-2 { animation: floatOrb2 12s ease-in-out infinite; }
      .pulse-line { animation: pulseGantt 4s ease-in-out infinite; }
      .bob-card { animation: boardBob 6s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Ambient Glowing Orbs in Background -->
  <g opacity="0.35">
    <circle class="orb-1" cx="220" cy="100" r="160" fill="#6366f1" filter="url(#glow)" />
    <circle class="orb-2" cx="1020" cy="300" r="180" fill="#ec4899" filter="url(#glow)" />
    <circle class="orb-1" cx="900" cy="90" r="140" fill="#06b6d4" filter="url(#glow)" />
  </g>

  <!-- Tech Grid Overlay -->
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Dynamic Project Management Visuals (Background Wings) -->
  <!-- Left Side: Interactive Mini-Gantt / Timeline Preview -->
  <g class="bob-card" transform="translate(60, 240)" opacity="0.75" filter="url(#softShadow)">
    <rect width="260" height="130" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <text x="20" y="32" class="card-header">📊 SPRINT ROADMAP</text>
    <text x="180" y="32" class="card-sub">Q4 MILESTONES</text>

    <!-- Gantt Bars with Pulsing Elements -->
    <rect x="20" y="50" width="130" height="14" rx="7" fill="#6366f1" opacity="0.9" />
    <rect x="20" y="50" width="85" height="14" rx="7" fill="#818cf8" />
    <circle cx="105" cy="57" r="3" fill="#ffffff" />

    <rect x="90" y="74" width="145" height="14" rx="7" fill="#10b981" opacity="0.85" />
    <rect x="90" y="74" width="95" height="14" rx="7" fill="#34d399" />

    <rect x="50" y="98" width="110" height="14" rx="7" fill="#f59e0b" opacity="0.85" />
  </g>

  <!-- Right Side: Agile Kanban Board Mockup -->
  <g class="bob-card" transform="translate(880, 240)" opacity="0.75" filter="url(#softShadow)">
    <rect width="260" height="130" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <text x="20" y="32" class="card-header">📋 KANBAN FLOW</text>
    <text x="195" y="32" class="card-sub">ACTIVE</text>

    <!-- Kanban Columns -->
    <rect x="20" y="48" width="65" height="70" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <rect x="26" y="54" width="53" height="24" rx="4" fill="#334155" />
    <rect x="26" y="82" width="53" height="24" rx="4" fill="#334155" />

    <rect x="97" y="48" width="65" height="70" rx="6" fill="#1e293b" stroke="#6366f1" stroke-width="1" />
    <rect x="103" y="54" width="53" height="34" rx="4" fill="#4338ca" />
    <rect x="103" y="92" width="53" height="16" rx="4" fill="#312e81" />

    <rect x="174" y="48" width="65" height="70" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1" />
    <rect x="180" y="54" width="53" height="28" rx="4" fill="#065f46" />
  </g>

  <!-- Central Dynamic Connection Wave Behind Header -->
  <path class="pulse-line" d="M 120 180 Q 300 240, 600 170 T 1080 180" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.55" />

  <!-- FOREGROUND: Crystal Clear Text and Badges (Always on Top) -->
  <g id="foregroundContent" filter="url(#softShadow)">
    <!-- Category Pill -->
    <g transform="translate(480, 42)">
      <rect width="240" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1.2" />
      <circle cx="20" cy="16" r="5" fill="#10b981">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="36" y="21" class="pill-text" fill="#cbd5e1" letter-spacing="1">CURATED TECH DIRECTORY</text>
    </g>

    <!-- Main Title with Gradient Fill -->
    <text x="600" y="130" text-anchor="middle" class="title-text">
      Awesome Business Project Management
    </text>

    <!-- Accent Underline Bar -->
    <rect x="420" y="148" width="360" height="4" rx="2" fill="url(#accentGrad)" />

    <!-- Subtitle -->
    <text x="600" y="185" text-anchor="middle" class="subtitle-text">
      Top SaaS Platforms &amp; Self-Hosted Open-Source Work Operating Systems
    </text>

    <!-- Feature Attribute Pills (Centered Foreground) -->
    <g transform="translate(325, 222)">
      <!-- Pill 1: Agile & Scrum -->
      <g transform="translate(0, 0)">
        <rect width="165" height="36" rx="18" fill="url(#pillGrad1)" />
        <text x="82" y="23" text-anchor="middle" class="pill-text">🚀 Agile &amp; Scrum</text>
      </g>

      <!-- Pill 2: Gantt & Roadmaps -->
      <g transform="translate(180, 0)">
        <rect width="185" height="36" rx="18" fill="url(#pillGrad2)" />
        <text x="92" y="23" text-anchor="middle" class="pill-text">📊 Gantt &amp; Portfolios</text>
      </g>

      <!-- Pill 3: Self-Hosted Freedom -->
      <g transform="translate(380, 0)">
        <rect width="170" height="36" rx="18" fill="url(#pillGrad3)" />
        <text x="85" y="23" text-anchor="middle" class="pill-text">🔒 Self-Hosted FOSS</text>
      </g>
    </g>

    <!-- Footer Stats / Metric Indicators -->
    <g transform="translate(600, 310)" text-anchor="middle">
      <text class="card-sub" fill="#94a3b8" font-size="13px" letter-spacing="0.5">
        ⚡ Transparent Pricing Tiers • Free Plan Limits • Verified GitHub Star Metrics • Market Dynamics
      </text>
    </g>
  </g>
</svg>
